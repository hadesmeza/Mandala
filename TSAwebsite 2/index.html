<style>
:root {
  --bg:     #07080F;

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overscroll-behavior: none;

/* ── Header ── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;

#menu-btn { display:none; margin-left:auto; background:none; border:none; cursor:pointer; flex-direction:column; gap:4px; padding:4px; }
#menu-btn span { display:block; width:20px; height:2px; background:var(--text); border-radius:2px; }

/* ── Desktop ── */
@media (min-width: 768px) {
  body { overflow: hidden; }
  #header .sub { font-size:10px; color:var(--muted); margin-left:auto; white-space:nowrap; }

  #detail { flex:1; overflow-y:auto; padding:20px 28px; }
  #mobile-nav, #menu-btn, #drawer-overlay, #drawer { display:none !important; }

/* ── Mobile ── */
@media (max-width: 767px) {
  #header .sub { display:none; }

<script>
function highlightJava(code) {
  const keywords = /\b(public|private|class|record|new|return|if|else|for|while|break|continue|void|int|boolean|char|double|static|final|null|true|false|this)\b/g;
  const types    = /\b(List|Map|Set|Queue|Deque|PriorityQueue|ArrayDeque|ArrayList|HashMap|HashSet|String|Integer|Character|Arrays|Collections|IntStream|Comparator|Optional|Objects|Math)\b/g;
  const comments = /(\/\/[^\n]*)/g;
  const strings  = /("[^"]*")/g;
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(strings,  '<span class="st">$1</span>')
    .replace(comments, '<span class="cm">$1</span>')
    .replace(keywords, '<span class="kw">$1</span>')
    .replace(types,    '<span class="tp">$1</span>');
}

const patterns = [
  {
    id:"two-pointer", name:"Two Pointers", color:"#00D4FF", freq:"★★★★★",
    triggerWords:["sorted array","pair sum","palindrome","in-place","remove duplicates","container water"],
    rule:"Start at both ends. Walk inward. The sorted order tells you which side to move.",
    diagram:
`  [ 1   3   5   7   9  11 ]    target = 12
    ↑                   ↑
   left               right     sum=12 ✓ found!

  [ 1   3   5   7   9  11 ]    target = 10
    ↑               ↑
   left           right         sum=10 ✓ found!

  [ 1   3   5   7   9  11 ]    target = 10
        ↑       ↑
       left   right             sum=12 → too big → right--

Rule: sum too small → left++  (need bigger)
      sum too big  → right--  (need smaller)
      sum matches  → done ✓`,
    insight:"Two indices walking toward each other on sorted data. Sorted order guarantees: moving left up increases the sum, moving right down decreases it. That's the entire trick.",
    template: highlightJava(
`public int[] twoSum(int[] nums, int target) {
    int left  = 0;
    int right = nums.length - 1;

    while (left < right) {
        int sum = nums[left] + nums[right];

        if      (isTooSmall(sum, target)) left++;
        else if (isTooBig(sum, target))   right--;
        else                              return new int[]{left + 1, right + 1};
    }
    return new int[]{};
}

// ── 3Sum: fix one element, then run two-pointer for the pair ──
public List<List<Integer>> threeSum(int[] nums) {
    Arrays.sort(nums);
    List<List<Integer>> result = new ArrayList<>();

    for (int i = 0; i < nums.length - 2; i++) {
        if (isDuplicate(nums, i)) continue;
        result.addAll(twoSumPairs(nums, i + 1, nums.length - 1, -nums[i]));
    }
    return result;
}

private List<List<Integer>> twoSumPairs(int[] nums, int left, int right, int target) {
    List<List<Integer>> pairs = new ArrayList<>();
    while (left < right) {
        int sum = nums[left] + nums[right];
        if      (isTooSmall(sum, target)) left++;
        else if (isTooBig(sum, target))   right--;
        else { pairs.add(List.of(-target, nums[left++], nums[right--])); }
    }
    return pairs;
}

private boolean isTooSmall(int sum, int target) { return sum < target; }
private boolean isTooBig(int sum, int target)   { return sum > target; }
private boolean isDuplicate(int[] nums, int i)  { return i > 0 && nums[i] == nums[i - 1]; }`),
    questions:[
      {name:"Two Sum II",diff:"Easy",note:"sorted → two pointers"},
      {name:"Container With Most Water",diff:"Medium",note:"shrink shorter side"},
      {name:"3Sum",diff:"Medium",note:"sort + two-pointer per i"},
      {name:"Trapping Rain Water",diff:"Hard",note:"track leftMax, rightMax"},
      {name:"Valid Palindrome",diff:"Easy",note:"skip non-alphanum"},
    ]
  },
  {
    id:"sliding-window", name:"Sliding Window", color:"#FF6B6B", freq:"★★★★★",
    triggerWords:["substring","subarray","contiguous","at most k","longest","minimum window","max sum k elements"],
    rule:"Grow the window right. The moment it breaks the rule, shrink it from the left until it's valid again.",
    diagram:
`  a  b  c  a  b  c  b  b     find longest with no repeats
  ↑           ↑
  L           R               window = "abca" ✗ duplicate 'a'!
                               → shrink: move L right

     b  c  a  b  c  b  b
     ↑        ↑
     L        R               window = "bcab" ✗ duplicate 'b'!
                               → shrink again

        c  a  b  c  b  b
        ↑     ↑
        L     R               window = "cab" ✓ valid → keep expanding

        c  a  b  c  b  b
        ↑        ↑
        L        R            window = "cabc" ✗ duplicate 'c'!

Key: every element enters once (R++) and leaves once (L++) → O(n)`,
    insight:"The window [left, right] is your current candidate. right expands it greedily, left repairs it when broken. A HashMap remembers what's inside so you never scan backwards.",
    template: highlightJava(
`// Longest substring without repeating characters
public int lengthOfLongestSubstring(String s) {
    Map<Character, Integer> lastSeenAt = new HashMap<>();
    int maxLength = 0;
    int left = 0;

    for (int right = 0; right < s.length(); right++) {
        char c = s.charAt(right);

        if (isInsideWindow(lastSeenAt, c, left)) {
            left = justPastPreviousOccurrence(lastSeenAt, c);
        }

        lastSeenAt.put(c, right);
        maxLength = Math.max(maxLength, windowSize(left, right));
    }
    return maxLength;
}

// Minimum window substring — need/have pattern
public String minWindow(String s, String t) {
    Map<Character, Integer> need   = buildFrequencyMap(t);
    Map<Character, Integer> window = new HashMap<>();
    int have = 0, required = need.size();
    int left = 0, minLen = Integer.MAX_VALUE, minLeft = 0;

    for (int right = 0; right < s.length(); right++) {
        addToWindow(window, s.charAt(right));
        if (satisfiesNeed(window, need, s.charAt(right))) have++;

        while (windowIsComplete(have, required)) {
            if (isShorterThanBest(right, left, minLen)) {
                minLen = windowSize(left, right);
                minLeft = left;
            }
            if (removingBreaksNeed(window, need, s.charAt(left))) have--;
            removeFromWindow(window, s.charAt(left++));
        }
    }
    return minLen == Integer.MAX_VALUE ? "" : s.substring(minLeft, minLeft + minLen);
}

// ── Helpers ──
private boolean isInsideWindow(Map<Character, Integer> lastSeen, char c, int left) {
    return lastSeen.containsKey(c) && lastSeen.get(c) >= left;
}
private int justPastPreviousOccurrence(Map<Character, Integer> lastSeen, char c) {
    return lastSeen.get(c) + 1;
}
private int windowSize(int left, int right)  { return right - left + 1; }
private boolean isShorterThanBest(int right, int left, int best) { return windowSize(left, right) < best; }
private boolean windowIsComplete(int have, int required)         { return have == required; }
private boolean satisfiesNeed(Map<Character,Integer> win, Map<Character,Integer> need, char c) {
    return need.containsKey(c) && win.get(c).equals(need.get(c));
}
private boolean removingBreaksNeed(Map<Character,Integer> win, Map<Character,Integer> need, char c) {
    return need.containsKey(c) && win.get(c) <= need.get(c);
}
private void addToWindow(Map<Character, Integer> window, char c)    { window.merge(c,  1, Integer::sum); }
private void removeFromWindow(Map<Character, Integer> window, char c){ window.merge(c, -1, Integer::sum); }
private Map<Character, Integer> buildFrequencyMap(String s) {
    Map<Character, Integer> freq = new HashMap<>();
    for (char c : s.toCharArray()) freq.merge(c, 1, Integer::sum);
    return freq;
}`),

    triggerWords:["linked list cycle","find middle","palindrome linked list","happy number","find duplicate"],
    rule:"Send two runners into the list. Fast runs at 2x. If there's a loop they'll meet. If there isn't, fast finds the end and slow finds the middle.",
    diagram:
`  Cycle detection:

  1 → 2 → 3 → 4 → 5
              ↑       ↓
              8 ← 7 ← 6

  Step 1: slow=1  fast=1
  Step 2: slow=2  fast=3
  Step 3: slow=3  fast=5
  Step 4: slow=4  fast=7
  Step 5: slow=5  fast=5  ← they meet! cycle confirmed ✓

  Step 2: slow=2  fast=3
  Step 3: slow=3  fast=5

    insight:"Fast moves 2× so when fast finishes one loop slow has done half. They meet in a cycle because fast laps slow. The meeting point math gives you the cycle entry for free.",
    template: highlightJava(
`public class ListNode {
    int val; ListNode next;
    ListNode(int val) { this.val = val; }
}

public boolean hasCycle(ListNode head) {
    ListNode slow = head;
    ListNode fast = head;

    while (canAdvanceFast(fast)) {
        slow = slow.next;
        fast = fast.next.next;
        if (haveCollided(slow, fast)) return true;
    }
    return false;
}

public ListNode findMiddle(ListNode head) {
    ListNode slow = head;
    ListNode fast = head;

    while (canAdvanceFast(fast)) {
        slow = slow.next;
        fast = fast.next.next;
    }
    return slow;
}

public boolean isPalindrome(ListNode head) {
    ListNode middle          = findMiddle(head);
    ListNode reversedSecHalf = reverse(middle);
    return firstHalfMatches(head, reversedSecHalf);
}

// ── Helpers ──
private boolean canAdvanceFast(ListNode fast) {
    return fast != null && fast.next != null;
}
private boolean haveCollided(ListNode slow, ListNode fast) {
    return slow == fast;
}
private boolean firstHalfMatches(ListNode a, ListNode b) {
    while (b != null) {
        if (a.val != b.val) return false;
        a = a.next; b = b.next;
    }
    return true;
}
private ListNode reverse(ListNode head) {
    ListNode prev = null;
    while (head != null) {
        ListNode next = head.next;
        head.next = prev;
        prev = head;
        head = next;
    }
    return prev;
}`),

    template: highlightJava(
`// BFS — shortest path
public int shortestPath(Map<Integer, List<Integer>> graph, int source, int target) {
    Queue<Integer> queue   = new ArrayDeque<>();
    Set<Integer>   visited = new HashSet<>();

    enqueue(queue, visited, source);
    int distance = 0;

    while (!queue.isEmpty()) {
        int levelSize = queue.size();

        for (int i = 0; i < levelSize; i++) {
            int node = queue.poll();
            if (isTarget(node, target)) return distance;

            for (int neighbor : graph.get(node)) {
                if (notVisited(visited, neighbor)) enqueue(queue, visited, neighbor);
            }
        }
        distance++;
    }
    return -1;
}

// DFS — number of islands
public int numIslands(char[][] grid) {
    int islands = 0;
    for (int row = 0; row < grid.length; row++) {
        for (int col = 0; col < grid[0].length; col++) {
            if (isLand(grid, row, col)) {
                sinkIsland(grid, row, col);
                islands++;
            }
        }
    }
    return islands;
}

private void sinkIsland(char[][] grid, int row, int col) {
    if (isOutOfBounds(grid, row, col) || !isLand(grid, row, col)) return;
    grid[row][col] = '0';
    sinkIsland(grid, row + 1, col);
    sinkIsland(grid, row - 1, col);
    sinkIsland(grid, row, col + 1);
    sinkIsland(grid, row, col - 1);
}

// ── Helpers ──
private void enqueue(Queue<Integer> q, Set<Integer> visited, int node) {
    q.offer(node); visited.add(node);
}
private boolean isTarget(int node, int target)            { return node == target; }
private boolean notVisited(Set<Integer> visited, int n)   { return !visited.contains(n); }
private boolean isLand(char[][] grid, int r, int c)       { return grid[r][c] == '1'; }
private boolean isOutOfBounds(char[][] grid, int r, int c) {
    return r < 0 || r >= grid.length || c < 0 || c >= grid[0].length;
}`),

`// Classic binary search
public int binarySearch(int[] nums, int target) {
    int lo = 0;
    int hi = nums.length - 1;

    while (searchSpaceNotEmpty(lo, hi)) {
        int mid = midpoint(lo, hi);

        if      (isTarget(nums[mid], target))    return mid;
        else if (isBeforeTarget(nums[mid], target)) lo = mid + 1;
        else                                     hi = mid - 1;
    }
    return -1;
}

// Answer-space binary search — Koko Eating Bananas
public int minEatingSpeed(int[] piles, int h) {
    int lo = 1;
    int hi = maxPile(piles);

    while (lo < hi) {
        int mid = midpoint(lo, hi);
        if (canFinishAtSpeed(piles, mid, h)) hi = mid; // works — try smaller
        else                                 lo = mid + 1;
    }
    return lo;
}

// Search in rotated sorted array
public int searchRotated(int[] nums, int target) {
    int lo = 0, hi = nums.length - 1;

    while (searchSpaceNotEmpty(lo, hi)) {
        int mid = midpoint(lo, hi);
        if (isTarget(nums[mid], target)) return mid;

        if (leftHalfIsSorted(nums, lo, mid)) {
            if (targetIsInLeftHalf(nums, lo, mid, target)) hi = mid - 1;
            else                                           lo = mid + 1;
        } else {
            if (targetIsInRightHalf(nums, mid, hi, target)) lo = mid + 1;
            else                                            hi = mid - 1;
        }
    }
    return -1;
}

private boolean searchSpaceNotEmpty(int lo, int hi)       { return lo <= hi; }
private int     midpoint(int lo, int hi)                  { return lo + (hi - lo) / 2; }
private boolean isTarget(int val, int target)             { return val == target; }
private boolean isBeforeTarget(int val, int target)       { return val < target; }
private int     maxPile(int[] piles)                      { return Arrays.stream(piles).max().getAsInt(); }
private boolean leftHalfIsSorted(int[] nums, int lo, int mid)    { return nums[lo] <= nums[mid]; }
private boolean targetIsInLeftHalf(int[] nums, int lo, int mid, int t)  { return nums[lo] <= t && t < nums[mid]; }
private boolean targetIsInRightHalf(int[] nums, int mid, int hi, int t) { return nums[mid] < t && t <= nums[hi]; }

// Merge K sorted lists
public ListNode mergeKLists(ListNode[] lists) {
    PriorityQueue<ListNode> minHeap = buildNodeHeap();
    seedWithHeads(minHeap, lists);

    ListNode dummy = new ListNode(0);
    ListNode tail  = dummy;

    while (!minHeap.isEmpty()) {
        tail.next = minHeap.poll();
        tail = tail.next;
        if (hasNext(tail)) minHeap.offer(tail.next);
    }
    return dummy.next;
}

// Running median — two heaps
class MedianFinder {
    private final PriorityQueue<Integer> lowerHalf = new PriorityQueue<>(Comparator.reverseOrder());
    private final PriorityQueue<Integer> upperHalf = new PriorityQueue<>();

    public void addNum(int num) {
        lowerHalf.offer(num);
        upperHalf.offer(lowerHalf.poll());        // push smallest of lower into upper
        if (lowerIsSmaller()) upperHalf.offer(upperHalf.poll()); // rebalance — wait, reverse
        if (lowerIsSmaller()) lowerHalf.offer(upperHalf.poll());
    }

    public double findMedian() {
        return isEvenSplit()
            ? averageOfTops()
            : (double) lowerHalf.peek();
    }

    private boolean lowerIsSmaller() { return lowerHalf.size() < upperHalf.size(); }
    private boolean isEvenSplit()    { return lowerHalf.size() == upperHalf.size(); }
    private double  averageOfTops()  { return (lowerHalf.peek() + upperHalf.peek()) / 2.0; }
}

`// House Robber — space-optimized 1D DP
public int rob(int[] nums) {
    if (hasSingleHouse(nums)) return nums[0];

    int bestWithoutPrevious = nums[0];
    int bestUpToCurrent     = Math.max(nums[0], nums[1]);

    for (int i = 2; i < nums.length; i++) {
        int robCurrent  = bestWithoutPrevious + nums[i];
        int skipCurrent = bestUpToCurrent;
        int newBest     = Math.max(robCurrent, skipCurrent);

        bestWithoutPrevious = bestUpToCurrent;
        bestUpToCurrent     = newBest;
    }
    return bestUpToCurrent;
}

// Longest Common Subsequence — 2D DP
public int longestCommonSubsequence(String text1, String text2) {
    int m = text1.length(), n = text2.length();
    int[][] dp = new int[m + 1][n + 1];

    for (int i = 1; i <= m; i++) {
        for (int j = 1; j <= n; j++) {
            if (charsMatch(text1, i, text2, j)) dp[i][j] = extendMatch(dp, i, j);
            else                                dp[i][j] = bestOfSkippingEither(dp, i, j);
        }
    }
    return dp[m][n];
}

// Coin Change — unbounded knapsack
public int coinChange(int[] coins, int amount) {
    int[] minCoins = buildDpArray(amount);

    for (int current = 1; current <= amount; current++) {
        for (int coin : coins) {
            if (coinFits(coin, current)) {
                minCoins[current] = Math.min(minCoins[current], minCoins[current - coin] + 1);
            }
        }
    }
    return isReachable(minCoins, amount) ? minCoins[amount] : -1;
}

private boolean hasSingleHouse(int[] nums)              { return nums.length == 1; }
private boolean charsMatch(String a, int i, String b, int j) { return a.charAt(i-1) == b.charAt(j-1); }
private int     extendMatch(int[][] dp, int i, int j)   { return dp[i-1][j-1] + 1; }
private int     bestOfSkippingEither(int[][] dp, int i, int j) { return Math.max(dp[i-1][j], dp[i][j-1]); }
private int[]   buildDpArray(int amount) {
    int[] dp = new int[amount + 1];
    Arrays.fill(dp, amount + 1); // sentinel: "impossible"
    dp[0] = 0;
    return dp;
}
private boolean coinFits(int coin, int current)         { return coin <= current; }
private boolean isReachable(int[] dp, int amount)       { return dp[amount] <= amount; }`),

`// Valid Parentheses
public boolean isValid(String s) {
    Deque<Character> stack = new ArrayDeque<>();
    Map<Character, Character> matchingOpen = Map.of(')', '(', ']', '[', '}', '{');

    for (char c : s.toCharArray()) {
        if (isOpenBracket(c, matchingOpen)) {
            stack.push(c);
        } else {
            if (stackIsEmpty(stack) || topDoesNotMatch(stack, matchingOpen, c)) return false;
            stack.pop();
        }
    }
    return stack.isEmpty();
}

// Daily Temperatures — monotonic decreasing stack
public int[] dailyTemperatures(int[] temps) {
    int[] daysToWarm = new int[temps.length];
    Deque<Integer> waitingDays = new ArrayDeque<>(); // indices of unresolved days

    for (int today = 0; today < temps.length; today++) {
        while (warmerDayArrived(waitingDays, temps, today)) {
            int coldDay = waitingDays.pop();
            daysToWarm[coldDay] = daysUntilWarmer(coldDay, today);
        }
        waitingDays.push(today);
    }
    return daysToWarm;
}

// Largest Rectangle in Histogram
public int largestRectangleArea(int[] heights) {
    Deque<Integer> stack = new ArrayDeque<>();
    int maxArea = 0;

    for (int i = 0; i <= heights.length; i++) {
        int currentHeight = isSentinel(i, heights) ? 0 : heights[i];

        while (stackHasHigherBar(stack, heights, currentHeight)) {
            int height = heights[stack.pop()];
            int width  = widthOfRectangle(stack, i);
            maxArea = Math.max(maxArea, height * width);
        }
        stack.push(i);
    }
    return maxArea;
}

// ── Helpers ──
private boolean isOpenBracket(char c, Map<Character, Character> map) { return !map.containsKey(c); }
private boolean stackIsEmpty(Deque<?> stack)                          { return stack.isEmpty(); }
private boolean topDoesNotMatch(Deque<Character> stack, Map<Character,Character> map, char c) {
    return stack.peek() != map.get(c);
}
private boolean warmerDayArrived(Deque<Integer> waiting, int[] temps, int today) {
    return !waiting.isEmpty() && temps[waiting.peek()] < temps[today];
}
private int daysUntilWarmer(int coldDay, int today) { return today - coldDay; }
private boolean isSentinel(int i, int[] heights)    { return i == heights.length; }
private boolean stackHasHigherBar(Deque<Integer> stack, int[] heights, int current) {
    return !stack.isEmpty() && heights[stack.peek()] > current;
}
private int widthOfRectangle(Deque<Integer> stack, int i) {
    return stack.isEmpty() ? i : i - stack.peek() - 1;

`// Combination Sum — reuse elements allowed
public List<List<Integer>> combinationSum(int[] candidates, int target) {
    Arrays.sort(candidates);
    List<List<Integer>> results = new ArrayList<>();
    findCombinations(candidates, target, 0, new ArrayList<>(), results);
    return results;
}

private void findCombinations(int[] candidates, int remaining, int startIndex,
                               List<Integer> current, List<List<Integer>> results) {
    if (targetReached(remaining)) {
        results.add(copyOf(current));
        return;
    }
    for (int i = startIndex; i < candidates.length; i++) {
        if (exceedsTarget(candidates[i], remaining)) break; // sorted → prune rest too

        choose(current, candidates[i]);
        findCombinations(candidates, remaining - candidates[i], i, current, results);
        unchoose(current); // ← this is the backtrack
    }
}

public List<List<String>> solveNQueens(int n) {

    int[] queenInRow = new int[n];
    Set<Integer> occupiedCols  = new HashSet<>();
    Set<Integer> occupiedDiag1 = new HashSet<>(); // row - col
    Set<Integer> occupiedDiag2 = new HashSet<>(); // row + col

    placeNextQueen(0, n, queenInRow, occupiedCols, occupiedDiag1, occupiedDiag2, solutions);
    return solutions;
}

private void placeNextQueen(int row, int n, int[] queenInRow,
    Set<Integer> cols, Set<Integer> diag1, Set<Integer> diag2, List<List<String>> solutions) {
    if (allRowsFilled(row, n)) {
        solutions.add(buildBoard(queenInRow, n));
        return;

    for (int col = 0; col < n; col++) {
        if (isThreatened(row, col, cols, diag1, diag2)) continue;

        placeQueen(row, col, queenInRow, cols, diag1, diag2);
        placeNextQueen(row + 1, n, queenInRow, cols, diag1, diag2, solutions);
        removeQueen(row, col, cols, diag1, diag2); // ← backtrack
    }
}

private void    unchoose(List<Integer> path)        { path.remove(path.size() - 1); }
private List<Integer> copyOf(List<Integer> path)   { return new ArrayList<>(path); }
private boolean allRowsFilled(int row, int n)       { return row == n; }
private boolean isThreatened(int row, int col, Set<Integer> cols, Set<Integer> d1, Set<Integer> d2) {

public int[][] merge(int[][] intervals) {
    sortByStartTime(intervals);

  {

    triggerWords:["prefix search","autocomplete","starts with","add and search words","word search dictionary"],
    rule:"Build a tree where each edge is one character. Walking a path spells a word. isEnd marks where valid words finish.",
    diagram:
`  Insert: "cat", "car", "card", "care", "bat"

          root
         /    \\
        c      b
        |      |
        a      a
       / \\     |
      t   r    t
      ✓   |    ✓  "bat" ends here
         / \\
        d   e
        ✓   ✓   "card" and "care" end here

  search("car")   → walk c→a→r, isEnd=false → false
  search("card")  → walk c→a→r→d, isEnd=true  → true ✓
  startsWith("ca")→ walk c→a, node exists     → true ✓

  Wildcard "ca." → at '.', try ALL children of 'a' (t and r)`,

    template: highlightJava(
`class Trie {

    private static class TrieNode {
        Map<Character, TrieNode> children = new HashMap<>();
        boolean isEnd = false;

        boolean hasChild(char c)               { return children.containsKey(c); }
        TrieNode getChild(char c)              { return children.get(c); }
        TrieNode addChild(char c)              { return children.computeIfAbsent(c, k -> new TrieNode()); }
        Collection<TrieNode> allChildren()     { return children.values(); }
        void markAsWordEnd()                   { isEnd = true; }
    }

    private final TrieNode root = new TrieNode();

    public void insert(String word) {
        TrieNode node = root;
        for (char c : word.toCharArray()) node = node.addChild(c);
        node.markAsWordEnd();
    }

    public boolean search(String word) {
        TrieNode node = walkTo(word);
        return nodeExists(node) && node.isEnd;
    }

    public boolean startsWith(String prefix) {
        return nodeExists(walkTo(prefix));
    }

    // Wildcard search: '.' matches any character
    public boolean searchWithWildcard(String word) {
        return matchFrom(root, word, 0);
    }

    private boolean matchFrom(TrieNode node, String word, int index) {
        if (reachedEnd(word, index)) return node.isEnd;

        char c = word.charAt(index);

        if (isWildcard(c)) return anyChildMatches(node, word, index);
        else               return exactChildMatches(node, c, word, index);
    }

    // ── Helpers ──
    private TrieNode walkTo(String prefix) {
        TrieNode node = root;
        for (char c : prefix.toCharArray()) {
            if (!node.hasChild(c)) return null;
            node = node.getChild(c);
        }
        return node;
    }
    private boolean nodeExists(TrieNode node)           { return node != null; }
    private boolean reachedEnd(String word, int index)  { return index == word.length(); }
    private boolean isWildcard(char c)                  { return c == '.'; }
    private boolean anyChildMatches(TrieNode node, String word, int index) {
        return node.allChildren().stream().anyMatch(child -> matchFrom(child, word, index + 1));
    }
    private boolean exactChildMatches(TrieNode node, char c, String word, int index) {
        return node.hasChild(c) && matchFrom(node.getChild(c), word, index + 1);
    }
}`),

`// Topological Sort — Kahn's BFS
public int[] findOrder(int numCourses, int[][] prerequisites) {
    int[] inDegree = new int[numCourses];
    List<List<Integer>> dependents = buildAdjacencyList(numCourses, prerequisites, inDegree);
    Queue<Integer> readyToTake    = findCoursesWithNoPrereqs(inDegree, numCourses);

    int[] order = new int[numCourses];
    int taken   = 0;

    while (!readyToTake.isEmpty()) {
        int course = readyToTake.poll();
        order[taken++] = course;

        for (int dependent : dependents.get(course)) {
            decrementPrereqs(inDegree, dependent);
            if (allPrereqsDone(inDegree, dependent)) readyToTake.offer(dependent);
        }
    }
    return allCoursesTaken(taken, numCourses) ? order : new int[0];
}

// Union-Find — path compression + union by rank
class UnionFind {
    private final int[] parent;
    private final int[] rank;

    UnionFind(int n) {
        parent = IntStream.range(0, n).toArray();
        rank   = new int[n];
    }

    int findRoot(int node) {
        if (isOwnParent(node)) return node;
        parent[node] = findRoot(parent[node]); // path compression
        return parent[node];
    }

    boolean union(int a, int b) {
        int rootA = findRoot(a), rootB = findRoot(b);
        if (alreadyConnected(rootA, rootB)) return false; // cycle detected

        attachSmallerToLarger(rootA, rootB);
        return true;
    }

    // ── Helpers ──
    private boolean isOwnParent(int node)              { return parent[node] == node; }
    private boolean alreadyConnected(int a, int b)     { return a == b; }
    private void attachSmallerToLarger(int a, int b) {
        if      (rank[a] < rank[b]) parent[a] = b;
        else if (rank[a] > rank[b]) parent[b] = a;
        else { parent[b] = a; rank[a]++; }
    }
}

// ── Graph builder helpers ──
private List<List<Integer>> buildAdjacencyList(int n, int[][] prereqs, int[] inDegree) {
    List<List<Integer>> graph = new ArrayList<>();
    IntStream.range(0, n).forEach(i -> graph.add(new ArrayList<>()));
    for (int[] prereq : prereqs) {
        graph.get(prereq[1]).add(prereq[0]);
        inDegree[prereq[0]]++;
    }
    return graph;
}
private Queue<Integer> findCoursesWithNoPrereqs(int[] inDegree, int n) {
    return IntStream.range(0, n).filter(i -> inDegree[i] == 0)
        .boxed().collect(Collectors.toCollection(ArrayDeque::new));
}
private void    decrementPrereqs(int[] inDegree, int course) { inDegree[course]--; }
private boolean allPrereqsDone(int[] inDegree, int course)   { return inDegree[course] == 0; }
private boolean allCoursesTaken(int taken, int total)        { return taken == total; }`),

const DIFF_COLOR = { Easy:"#34D399", Medium:"#FBBF24", Hard:"#F87171" };
let activeIdx  = 0;
let showTmpl   = false;
let drawerOpen = false;

function render() {
  const p = patterns[activeIdx];

  // Desktop sidebar
  document.getElementById('sidebar').innerHTML = patterns.map((x,i) => `
    <button class="nav-btn ${i===activeIdx?'active':''}"
      style="border-left-color:${i===activeIdx?x.color:'transparent'}"
      onclick="selectIdx(${i})">
      <div class="nav-name" style="color:${i===activeIdx?x.color:'#4A5080'}">${x.name}</div>
      <div class="nav-freq">${x.freq}</div>
    </button>`).join('');

  // Mobile drawer
  document.getElementById('drawer').innerHTML =
    '<div style="padding:0 16px 10px;font-size:10px;font-weight:700;letter-spacing:2px;color:#3D4060;text-transform:uppercase;">Patterns</div>' +
    patterns.map((x,i) => `
    <button class="drawer-btn ${i===activeIdx?'active':''}"
      style="border-left-color:${i===activeIdx?x.color:'transparent'}"
      onclick="selectIdx(${i});closeDrawer()">
      <div class="nav-name" style="color:${i===activeIdx?x.color:'#4A5080'}">${x.name}</div>
      <div class="nav-freq">${x.freq}</div>
    </button>`).join('');

  // Mobile bottom nav
  document.getElementById('mob-label').textContent   = p.name;
  document.getElementById('mob-counter').textContent = `${activeIdx+1}/${patterns.length}`;

  // Detail header
  const dot = document.getElementById('dot');
  dot.style.background = p.color;
  dot.style.boxShadow  = `0 0 10px ${p.color}`;
  document.querySelector('.detail-header').style.borderBottomColor = p.color + '44';
  const title = document.getElementById('detail-title');
  title.textContent = p.name; title.style.color = p.color;
  document.getElementById('detail-freq').textContent = p.freq;

  // Triggers
  document.getElementById('triggers').innerHTML = p.triggerWords.map(w =>
    `<span class="tag" style="background:${p.color}15;border-color:${p.color}44;color:${p.color}">${w}</span>`
  ).join('');

  // Visual box
  document.getElementById('visual-box').style.borderLeftColor = p.color;
  document.getElementById('visual-rule').textContent    = '📐 ' + p.rule;
  document.getElementById('visual-diagram').textContent = p.diagram;

  // Insight
  document.getElementById('insight-box').style.borderLeftColor = p.color;
  document.getElementById('insight-text').textContent = p.insight;

  // Template
  showTmpl = false;
  const tmpl = document.getElementById('template-box');
  tmpl.innerHTML = p.template; tmpl.style.display = 'none'; tmpl.style.borderColor = p.color+'30';
  const btn = document.getElementById('toggle-btn');
  btn.textContent = '▶ SHOW JAVA CODE';
  btn.style.background = 'var(--bg3)'; btn.style.borderColor = 'var(--border)'; btn.style.color = 'var(--muted)';

  // Questions
  document.getElementById('questions').innerHTML = p.questions.map(q => `
    <div class="q-row">
      <span class="q-diff" style="color:${DIFF_COLOR[q.diff]}">${q.diff}</span>
      <span class="q-name">${q.name}</span>
      <span class="q-note">${q.note}</span>
    </div>`).join('');

  document.getElementById('detail').scrollTop = 0;
}

function selectIdx(i)  { activeIdx = i; render(); }
function navigate(dir) { activeIdx = (activeIdx + dir + patterns.length) % patterns.length; render(); }

function toggleTemplate() {
  const p = patterns[activeIdx];
  showTmpl = !showTmpl;
  const tmpl = document.getElementById('template-box');
  const btn  = document.getElementById('toggle-btn');
  tmpl.style.display = showTmpl ? 'block' : 'none';
  if (showTmpl) {
    btn.textContent = '▼ HIDE CODE';
    btn.style.background = p.color+'18'; btn.style.borderColor = p.color; btn.style.color = p.color;
  } else {
    btn.textContent = '▶ SHOW JAVA CODE';
    btn.style.background = 'var(--bg3)'; btn.style.borderColor = 'var(--border)'; btn.style.color = 'var(--muted)';
  }
}

function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('drawer').classList.toggle('open', drawerOpen);
  document.getElementById('drawer-overlay').classList.toggle('open', drawerOpen);
}
function closeDrawer() {
  drawerOpen = false;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

// Swipe navigation
let touchStartX = 0;
document.getElementById('detail').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.getElementById('detail').addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) navigate(dx < 0 ? 1 : -1);
}, {passive:true});

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') navigate(1);
  if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   navigate(-1);
});

render();
